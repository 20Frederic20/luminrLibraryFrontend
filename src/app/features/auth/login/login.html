<div class="login">
    <h1>Login</h1>

    <!-- On lie le formulaire Angular et on appelle la méthode onSubmit() lors de l'envoi -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- formControlName="email" fait le lien avec le FormControl du TypeScript -->
        <input type="email" formControlName="email" placeholder="Email">

        <!-- formControlName="password" fait le lien également -->
        <input type="password" formControlName="password" placeholder="Password">

        <!-- Le bouton est désactivé si le formulaire n'est pas valide (champs vides) -->
        <button type="submit" [disabled]="loginForm.invalid">Login</button>

    </form>
</div>
