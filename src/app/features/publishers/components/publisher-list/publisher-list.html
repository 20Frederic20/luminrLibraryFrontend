<div class="p-6 max-w-7xl mx-auto space-y-6">

  <!-- En-tête -->
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Gestion des Éditeurs</h1>
      <p class="text-sm text-slate-500">Gérez les maisons d'édition partenaires</p>
    </div>
    <a routerLink="/admin/publishers/new"
       class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors flex items-center gap-1">
      <span>+</span>
      <span>Nouvel Éditeur</span>
    </a>
  </div>

  <!-- DataTable -->
  <app-data-table
    [data]="publishers()"
    [columns]="columns"
    [isLoading]="isLoading()"
    [errorMessage]="errorMessage()"
    emptyMessage="Aucun éditeur trouvé dans la base de données.">

    <ng-template appTableActions let-publisher>
      <div class="flex items-center justify-end space-x-2">
        <a [routerLink]="['/publishers/edit', publisher.id]"
           class="px-2.5 py-1 text-xs font-medium text-blue-600 hover:bg-blue-50 rounded-md transition-colors">
          Éditer
        </a>
        <button (click)="deletePublisher(publisher)"
                class="px-2.5 py-1 text-xs font-medium text-red-600 hover:bg-red-50 rounded-md transition-colors">
          Supprimer
        </button>
      </div>
    </ng-template>

  </app-data-table>

</div>
