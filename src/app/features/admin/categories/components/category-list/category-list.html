<div class="p-6 max-w-7xl mx-auto space-y-6">

  <!-- Header -->
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Gestion des Catégories</h1>
      <p class="text-sm text-slate-500">Gérez le catalogue de catégories de votre médiathèque</p>
    </div>
    <a routerLink="/admin/categories/new"
       class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors">
      + Nouvelle Catégorie
    </a>
  </div>

  <!-- Le composant DataTable réutilisable -->
  <app-data-table
    [data]="categories()"
    [columns]="columns"
    [isLoading]="isLoading()"
    [errorMessage]="errorMessage()"
    emptyMessage="Aucune catégorie enregistrée.">

    <!-- Actions personnalisées par ligne -->
    <ng-template appTableActions let-category>
      <div class="flex items-center justify-end space-x-2">
        <a [routerLink]="['/categories/edit', category.id]"
           class="px-2.5 py-1 text-xs font-medium text-blue-600 hover:bg-blue-50 rounded-md transition-colors">
          Éditer
        </a>
        <button (click)="deleteCategory(category)"
                class="px-2.5 py-1 text-xs font-medium text-red-600 hover:bg-red-50 rounded-md transition-colors">
          Supprimer
        </button>
      </div>
    </ng-template>

  </app-data-table>

</div>
