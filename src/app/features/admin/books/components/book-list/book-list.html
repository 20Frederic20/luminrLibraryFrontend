<div class="p-6 max-w-7xl mx-auto space-y-6">

  <!-- En-tête -->
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Catalogue de Livres</h1>
      <p class="text-sm text-slate-500">Gérez le stock et la disponibilité des livres</p>
    </div>
    <a routerLink="/admin/books/new"
       class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors flex items-center gap-1">
      <span>+</span>
      <span>Nouveau Livre</span>
    </a>
  </div>

  <!-- DataTable -->
  <app-data-table
    [data]="books()"
    [columns]="columns"
    [isLoading]="isLoading()"
    [errorMessage]="errorMessage()"
    emptyMessage="Aucun livre enregistré dans la base de données.">

    <ng-template appTableActions let-book>
      <div class="flex items-center justify-end space-x-3">

        <!-- Stock status badge -->
        <span class="px-2 py-0.5 text-xs font-semibold rounded-full"
              [ngClass]="book.availableQuantity > 0 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'">
          Dispo: {{ book.availableQuantity }}/{{ book.quantity }}
        </span>

        <a (click)="updateBook(book)"
           class="px-2.5 py-1 text-xs font-medium text-blue-600 hover:bg-blue-50 rounded-md transition-colors">
          Éditer
        </a>

        <button (click)="deleteBook(book)"
                class="px-2.5 py-1 text-xs font-medium text-red-600 hover:bg-red-50 rounded-md transition-colors">
          Supprimer
        </button>
      </div>
    </ng-template>

  </app-data-table>

</div>
