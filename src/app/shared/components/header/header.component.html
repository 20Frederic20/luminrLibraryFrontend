<header class="w-full sticky top-0 z-50 bg-white shadow-xs border-b border-slate-100">
  <nav class="flex justify-between items-center h-20 px-6 max-w-7xl mx-auto">
    <!-- Logo -->
    <a routerLink="/" class="text-xl font-bold text-emerald-700 tracking-tight flex items-center gap-2">
      <svg class="w-7 h-7 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
      </svg>
      <span>Lumina Library</span>
    </a>

    <!-- Liens de Navigation -->
    <ul class="hidden md:flex items-center gap-8 text-sm font-medium">
      <li>
        <a routerLink="/" routerLinkActive="text-emerald-700 font-bold border-b-2 border-emerald-600" [routerLinkActiveOptions]="{ exact: true }" class="text-slate-600 hover:text-emerald-700 transition-colors pb-1">
          Accueil
        </a>
      </li>
      <li>
        <a routerLink="/books" routerLinkActive="text-emerald-700 font-bold border-b-2 border-emerald-600" class="text-slate-600 hover:text-emerald-700 transition-colors pb-1">
          Catalogue
        </a>
      </li>
      <li>
        <a routerLink="/authors" routerLinkActive="text-emerald-700 font-bold border-b-2 border-emerald-600" class="text-slate-600 hover:text-emerald-700 transition-colors pb-1">
          Auteurs
        </a>
      </li>
      <li>
        <a routerLink="/categories" routerLinkActive="text-emerald-700 font-bold border-b-2 border-emerald-600" class="text-slate-600 hover:text-emerald-700 transition-colors pb-1">
          Catégories
        </a>
      </li>
    </ul>

    <!-- Actions Utilisateur -->
    @if (!isLoggedIn()) {
      <a routerLink="/auth/login" class="text-sm font-semibold text-emerald-600 hover:underline">
        Se connecter
      </a>
    }

    <!-- Affiché si CONNECTÉ -->
    @if (isLoggedIn()) {
      <div class="flex items-center gap-4">
        <a routerLink="/profile" class="text-sm font-medium text-slate-700 hover:text-emerald-600">
          Mon Profil
        </a>
        <button (click)="logout()" class="text-sm font-medium text-rose-600 hover:underline">
          Déconnexion
        </button>
      </div>
    }
  </nav>
</header>
