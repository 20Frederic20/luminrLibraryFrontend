<div class="min-h-screen bg-slate-100 flex flex-col md:flex-row">

  <!-- 1. OVERLAY SOMBRE SUR MOBILE (ferme la sidebar quand on clique à côté) -->
  @if (isMobileSidebarOpen()) {
    <div
      (click)="closeMobileSidebar()"
      class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm md:hidden transition-opacity">
    </div>
  }

  <!-- 2. SIDEBAR (Fixe sur Desktop, Glissante sur Mobile) -->
  <div [ngClass]="{
        'translate-x-0': isMobileSidebarOpen(),
        '-translate-x-full': !isMobileSidebarOpen()
       }"
       class="fixed md:static inset-y-0 left-0 z-50 w-64 transform md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0">
    <app-sidebar (menuClick)="closeMobileSidebar()"></app-sidebar>
  </div>

  <!-- 3. ZONE CONTENU PRINCIPAL -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- Header Supérieur (Top Bar) -->
    <header class="h-16 bg-white border-b border-slate-200 px-4 md:px-8 flex items-center justify-between shrink-0">

      <!-- Bouton Burger Mobile -->
      <button
        (click)="toggleMobileSidebar()"
        class="p-2 rounded-lg text-slate-600 hover:bg-slate-100 md:hidden focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <!-- Titre ou recherche rapide -->
      <div class="hidden sm:flex items-center space-x-2 text-slate-400 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <span>Rechercher dans l'application...</span>
      </div>

      <!-- Profil Utilisateur & Notifications -->
      <div class="flex items-center space-x-4">
        <button class="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100 relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 01-6 0v-1m6 0H9"/></svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full"></span>
        </button>

        <div class="flex items-center space-x-3 border-l border-slate-200 pl-4">
          <div class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs">
            AD
          </div>
          <div class="hidden md:block text-left">
            <p class="text-xs font-semibold text-slate-700">Administrateur</p>
            <p class="text-[10px] text-slate-400">admin&#64;librarx.com</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Zone dynamique du contenu (Dashboard, BookList, etc.) -->
    <main class="flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
